<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Codex · 提示词管理</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=20261007-admin1" />
    <link rel="stylesheet" href="./console.css?v=20261007-admin1" />
    <style>
      body { padding: 24px; }
      .prompt-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
      .prompt-head a { color: var(--accent, #6ea8fe); text-decoration: none; }
      .prompt-status { margin: 12px 0 20px; opacity: .85; }
      .prompt-status.ok { color: #2f9e6b; }
      .prompt-status.error { color: #d9534f; }
      .prompt-card { border: 1px solid rgba(127,127,127,.28); border-radius: 10px; padding: 14px; margin: 10px 0 18px; }
      .prompt-card header { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
      .prompt-meta { font-size: 12px; opacity: .7; }
      .prompt-card textarea { width: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.5; }
      .prompt-actions { display: flex; gap: 10px; margin-top: 10px; }
      .prompt-actions button { padding: 6px 14px; border-radius: 8px; cursor: pointer; }
      h2 { margin: 22px 0 6px; font-size: 15px; opacity: .9; }
    </style>
  </head>
  <body>
    <div class="prompt-head">
      <h1>提示词管理</h1>
      <a href="./index.html">← 返回控制台</a>
    </div>
    <p class="prompt-meta">
      这里维护的是<b>平台默认</b>提示词；语义 Agent 与设备 Agent 的覆盖在各自编辑页里设置，未设置时逐级继承。
      保存后会自动推送到在线设备，下一条消息即生效（无需重启 Agent）。
    </p>
    <div id="status" class="prompt-status"></div>
    <div id="slotList"></div>
    <script type="module" src="./prompts.js"></script>
  </body>
</html>
