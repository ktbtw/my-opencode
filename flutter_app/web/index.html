<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="码控 - 远程设备管理控制台">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="码控">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>码控</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    清掉历史版本注册过的 Service Worker 与缓存：早先的构建带 PWA 缓存，发布新版后
    浏览器可能继续用旧的页面壳，出现新旧文件混用而白屏或启动报错。现在构建已不再
    注册 SW（--pwa-strategy=none），这里顺手把老注册与缓存清掉，让受影响的浏览器自愈。
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        registrations.forEach(function (registration) {
          registration.unregister();
        });
      });
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (keys) {
        keys.forEach(function (key) { caches.delete(key); });
      });
    }
  </script>

  <!--
    自带 CanvasKit：默认会去 www.gstatic.com 拉引擎文件，国内要么被拦要么很慢
    （实测走代理取 canvaskit.wasm 要十几秒），拉不到就是一直白屏。
    这里按 <base href> 拼出同源路径，两个 base（/ 与 /codex/）都成立，
    也避免深链路由下相对路径拼错。
  -->
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    (function () {
      var base = document.querySelector('base')?.getAttribute('href') || '/';
      if (base.charAt(base.length - 1) !== '/') base += '/';
      _flutter.loader.load({
        config: { canvasKitBaseUrl: base + 'canvaskit' }
      });
    })();
  </script>
</body>
</html>
