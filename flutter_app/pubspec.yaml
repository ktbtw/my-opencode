name: chat_codex_app
description: "Chat Codex - 远程设备与 Agent 管理控制台"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 路由
  go_router: ^14.2.7

  # 网络
  http: ^1.2.1

  # 本地存储
  shared_preferences: ^2.2.3

  # 文件选择
  file_picker: ^8.0.7

  # 图标
  cupertino_icons: ^1.0.8
  flutter_markdown: ^0.7.7+1
  flutter_math_fork: ^0.7.4
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
