name: chat_codex_app
description: "Chat Codex - 远程设备与 Agent 管理控制台"
publish_to: 'none'

version: 1.6.82+229

environment:
  sdk: ^3.8.0

dependencies:
  archive: ^4.0.9
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 路由
  go_router: ^14.2.7

  # 网络
  http: ^1.2.1
  crypto: ^3.0.6

  # 本地存储
  shared_preferences: ^2.2.3
  sqlite3_flutter_libs: ^0.5.29
  sqlite3: ^2.9.4

  # 文件选择
  file_picker: ^8.0.7
  desktop_drop: ^0.5.0
  pasteboard: ^0.4.0

  # 图标
  cupertino_icons: ^1.0.8
  markdown: ^7.3.0
  flutter_markdown: ^0.7.7+1
  flutter_math_fork: ^0.7.4
  webview_flutter: ^4.10.0
  dio: ^5.7.0
  path_provider: ^2.1.4
  path: ^1.9.0
  open_filex: ^4.5.0
  permission_handler: ^11.3.1
  package_info_plus: ^8.1.1
  url_launcher: ^6.3.1
  photo_view: ^0.15.0
  webview_windows: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: false
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon.png"
  image_path: "assets/icon.png"
  adaptive_icon_background: "#12328C"
  adaptive_icon_foreground: "assets/icon.png"
