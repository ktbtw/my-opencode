<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>全局悬浮对话完成状态预览</title>
  <style>
    :root {
      color-scheme: light;
      --page: #eef3f8;
      --panel: #f7faff;
      --surface: #ffffff;
      --line: #d0ddef;
      --line-soft: #e1e9f3;
      --text: #0f1729;
      --muted: #7b8da6;
      --muted-strong: #4a5d7a;
      --blue: #2563eb;
      --green: #15803d;
      --green-dark: #166534;
      --green-soft: #ecfdf5;
      --green-line: #86efac;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background: var(--page);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      color: var(--text);
    }

    .preview {
      width: min(100%, 390px);
    }

    .caption {
      margin: 0 0 10px 4px;
      color: var(--muted-strong);
      font-size: 12px;
    }

    .panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 12px 30px rgba(45, 72, 106, .12);
    }

    .header {
      display: flex;
      align-items: center;
      min-height: 54px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line-soft);
    }

    .icon {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 0;
      background: transparent;
      color: var(--blue);
      font-size: 22px;
      cursor: pointer;
    }

    .title {
      min-width: 0;
      flex: 1;
      margin: 0 8px;
      overflow: hidden;
      font-size: 17px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status {
      margin: 0 12px 10px 48px;
      color: var(--muted);
      font-size: 11px;
    }

    .message {
      margin: 0 12px 12px;
      padding: 14px;
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      background: var(--surface);
      line-height: 1.65;
      font-size: 14px;
    }

    .message-label {
      margin-bottom: 7px;
      color: #8a99ad;
      font-size: 11px;
    }

    .completion-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line-soft);
    }

    .completion-label {
      flex: 1;
      color: var(--green);
      font-size: 12px;
    }

    .complete-button {
      min-height: 34px;
      padding: 0 13px;
      border: 1px solid var(--green-line);
      border-radius: 8px;
      background: var(--green-soft);
      color: var(--green-dark);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: background .16s ease, border-color .16s ease;
    }

    .complete-button:hover {
      border-color: #4ade80;
      background: #dcfce7;
    }

    .complete-button:active {
      transform: translateY(1px);
    }

    .composer {
      display: flex;
      gap: 8px;
      padding: 0 12px 12px;
    }

    .input {
      min-width: 0;
      flex: 1;
      min-height: 44px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      resize: none;
    }

    .send {
      width: 44px;
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      background: var(--blue);
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .done {
      display: none;
      margin: 0 12px 12px;
      padding: 12px;
      border: 1px solid var(--green-line);
      border-radius: 10px;
      background: var(--green-soft);
      color: var(--green-dark);
      font-size: 13px;
    }

    .done strong {
      display: block;
      margin-bottom: 3px;
    }

    .hint {
      margin: 10px 0 0 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .panel.is-done .completion-row { display: none; }
    .panel.is-done .done { display: block; }
  </style>
</head>
<body>
  <main class="preview">
    <p class="caption">全局悬浮对话 · Agent 回复完成状态</p>
    <section class="panel" id="panel">
      <header class="header">
        <button class="icon" aria-label="返回">&#8249;</button>
        <h1 class="title">逆向专家安卓</h1>
        <button class="icon" aria-label="收起">&#8963;</button>
      </header>
      <div class="status">我的 Mac · 空闲</div>
      <article class="message">
        <div class="message-label">最近回复</div>
        已完成当前项目的配置检查，发现的问题已经修复，验证结果正常。
        <div class="completion-row">
          <span class="completion-label">回复已完成</span>
          <button class="complete-button" id="completeButton">本轮已完成</button>
        </div>
      </article>
      <div class="done" id="done">
        <strong>本轮已结束</strong>
        悬浮图标已恢复普通状态，不会再次请求 Agent。
      </div>
      <div class="composer">
        <textarea class="input" rows="1" placeholder="让选中的 Agent 继续工作"></textarea>
        <button class="send" aria-label="发送">&#10148;</button>
      </div>
    </section>
    <p class="hint">点击按钮只改变悬浮层状态，不会发送新的消息。</p>
  </main>
  <script>
    const panel = document.querySelector("#panel");
    const button = document.querySelector("#completeButton");
    button.addEventListener("click", () => {
      panel.classList.add("is-done");
    });
  </script>
</body>
</html>
