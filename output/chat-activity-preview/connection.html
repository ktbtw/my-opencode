<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>对话状态 · 行内动画预览</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#0f1729;background:#f2f6fc;font-synthesis:none}*{box-sizing:border-box}body{margin:0}main{max-width:1040px;margin:0 auto;padding:56px 28px;display:grid;grid-template-columns:1fr 410px;gap:64px;align-items:center}h1{font-size:32px;letter-spacing:-1px;font-weight:600;margin:16px 0}p{color:#4a5d7a;line-height:1.85;font-size:15px}.eyebrow{color:#2563eb;font-size:12px;letter-spacing:2px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 18px}button{font:inherit;cursor:pointer;border:1px solid #d0ddef;background:transparent;color:#4a5d7a;border-radius:8px;padding:10px 13px;transition:background .18s,color .18s}button[aria-pressed=true]{background:#2563eb;color:white;border-color:#2563eb}button:hover{border-color:#2563eb}button:focus-visible{outline:2px solid #2563eb;outline-offset:3px}.replay{color:#2563eb;border:0;padding-left:0}.note,label{font-size:12px;color:#4a5d7a}.phone{height:692px;border-radius:30px;border:1px solid #d0ddef;background:#f7faff;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 65px #1a3a6a0b}.system{display:flex;justify-content:space-between;padding:18px 24px 8px;font-size:12px}.header{padding:15px 18px;border-bottom:1px solid #e4ecf5;display:flex;gap:14px;align-items:center;background:white}.back{font-size:24px}.header b{display:block;font-size:15px;font-weight:600}.header small{display:block;color:#8fa3bf;font-size:11px;margin-top:4px}.dots{margin-left:auto;letter-spacing:2px}.messages{flex:1;padding:26px 18px;overflow:auto}.time{text-align:center;color:#8fa3bf;font-size:11px;margin-bottom:22px}.user{background:#2563eb;color:white;padding:11px 14px;line-height:1.6;border-radius:12px 12px 3px 12px;font-size:13px;max-width:86%;margin-left:auto;margin-bottom:28px}.agent{display:flex;gap:10px;align-items:flex-start}.avatar{flex:0 0 28px;height:28px;background:#eff6ff;border-radius:8px;display:grid;place-items:center;color:#2563eb;margin-top:2px}.response{min-width:0;flex:1}.body{background:white;border:1px solid #d0ddef;padding:13px 14px;border-radius:12px 12px 12px 3px;font-size:13px;line-height:1.8;margin-bottom:12px}.body p{font-size:13px;margin:0}.body p+p{margin-top:9px}.activity{display:flex;gap:9px;align-items:center;min-height:25px;padding:2px 0;color:#4a5d7a;font-size:12px}.glyph{width:18px;height:18px;display:flex;align-items:center;justify-content:center;gap:2.5px;flex-shrink:0}.glyph i{display:block;background:#2563eb;width:2.5px;height:7px;border-radius:2px;animation:breath 1.6s ease-in-out infinite;transform-origin:center}.glyph i:nth-child(2){animation-delay:-.27s}.glyph i:nth-child(3){animation-delay:-.53s}.caption{animation:enter .24s ease-out;line-height:1.5}.hint{font-size:11px;line-height:1.7;color:#8fa3bf;margin:4px 0 0 27px}.footer{background:white;padding:12px 14px 22px;border-top:1px solid #e4ecf5}.input{display:flex;align-items:center;gap:10px;background:#f8fafd;border:1px solid #d0ddef;border-radius:14px;padding:12px;color:#8fa3bf;font-size:13px}.input .placeholder{flex:1}.stop{height:30px;width:30px;padding:0;display:grid;place-items:center;border-radius:9px;border:1px solid #d0ddef;color:#2563eb}.stop:after{content:"";width:10px;height:10px;background:currentColor;border-radius:2px}.send{color:#2563eb;font-size:18px}.homebar{width:110px;height:4px;background:#0f1729;border-radius:2px;margin:18px auto -12px}.done{font-size:11px;color:#8fa3bf;margin-top:8px}.reduced *{animation:none!important;transition:none!important}
@keyframes breath{0%,100%{transform:scaleY(.65);opacity:.42}50%{transform:scaleY(1.6);opacity:1}}@keyframes enter{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:760px){main{padding:24px 16px;display:flex;flex-direction:column;gap:26px;align-items:stretch}.phone{width:100%;max-width:410px;align-self:center}h1{font-size:26px}.controls{margin-top:18px}}
.connection{background:white;font-size:11px;color:#4a5d7a;padding:0 20px 10px;border-bottom:1px solid #e4ecf5}.connection summary{cursor:pointer;padding:10px 0;list-style:none}.connection summary:after{content:'⌄';float:right}.connection dl{margin:0 0 10px}.connection dl div{display:flex;justify-content:space-between;gap:16px;padding:5px 0}.connection dt{color:#8fa3bf}.connection dd{margin:0}.connection small{font-size:10px;line-height:1.6;color:#8fa3bf}</style><main><section><span class="eyebrow">CHAT CODEX / 对话状态</span><h1>轻一点，留给对话。</h1><p>状态融入回复：三根短线缓缓呼吸，<br>文字在同步、等待和输出之间轻轻过渡。</p><div class="controls" role="group" aria-label="预览场景"><button data-state="new">刚发消息</button><button data-state="sync" aria-pressed="true">回到前台</button><button data-state="partial">已有回复</button><button data-state="tools">等待工具</button><button data-state="follow">继续输出</button><button data-state="done">完成</button></div><button class="replay" id="replay">↻ 播放恢复过程</button><p><label><input type="checkbox" id="reduce"> 减少动画</label></p><p class="note">预览沿用 App 的颜色与消息布局。<br>点击场景，查看空回复和已有回复的不同表现。</p></section><section class="phone" aria-label="手机对话预览"><div class="system"><b>9:41</b><span>▮▮▮　▰</span></div><header class="header"><span class="back">‹</span><div><b>造梦西游 6</b><small>我的 Mac · 在线</small></div><span class="dots">···</span></header><div class="messages"><div class="time">今天 09:40</div><div class="user">帮我看看这个项目现在的进展，接着把剩下的部分完成。</div><div class="agent"><div class="avatar">✳</div><div class="response"><div class="body" id="body" hidden><p>我已经整理好了当前的项目结构，正在检查剩余的交互。</p><p id="more" hidden>检查完成。页面布局和按钮状态已经统一，接下来可以直接体验。</p></div><div class="activity" id="activity" role="status"><span class="glyph" aria-hidden="true"><i></i><i></i><i></i></span><span class="caption" id="caption">正在同步最新回复</span></div><div class="hint" id="hint">稍等片刻，接上刚才的进度</div><div class="done" id="done" hidden>已完成</div></div></div></div><footer class="footer"><div class="input"><span>＋</span><span class="placeholder">发送消息…</span><button class="stop" id="stop" aria-label="停止回复"></button><span class="send">↑</span></div><div class="homebar"></div></footer></section></main>
<script>
const modes={normal:['连接正常 · 68 ms','已连接 · 68 ms','在线','已连接'],output:['连接正常 · 68 ms · 接收 32 字/秒','已连接 · 68 ms','在线','已连接'],resume:['正在同步对话 · 68 ms','已连接 · 68 ms','在线','正在同步'],agent:['Agent 离线 · 68 ms','已连接 · 68 ms','离线','等待恢复'],broken:['服务连接中断','连接中断','待确认','等待恢复']};
const controls=document.querySelector('.controls');controls.innerHTML=Object.keys(modes).map((k,i)=>`<button data-mode="${k}">${['正常','输出中','后台恢复','Agent 离线','服务中断'][i]}</button>`).join('');
document.querySelector('h1').textContent='连接情况，一眼看清。';document.querySelector('section p').textContent='点击顶部状态行展开链路详情。延迟来自手机到服务端，接收速度随正文更新。';
document.querySelector('.replay').remove();document.querySelector('.header').insertAdjacentHTML('afterend',`<details class="connection"><summary id="link-label">● 连接正常 · 68 ms</summary><dl><div><dt>手机到服务端</dt><dd id="service">已连接 · 68 ms</dd></div><div><dt>服务端到 Agent</dt><dd id="agent">在线</dd></div><div><dt>回复接收</dt><dd id="reply">已连接</dd></div><div><dt>最近收到正文</dt><dd>2 秒前</dd></div></dl><small>延迟为最近一次请求的往返耗时；接收速度包含恢复补传。</small></details>`);
controls.querySelectorAll('button').forEach(b=>b.onclick=()=>{const m=modes[b.dataset.mode];document.querySelector('#link-label').textContent='● '+m[0];['service','agent','reply'].forEach((id,i)=>document.getElementById(id).textContent=m[i+1]);document.querySelector('.connection').style.color=['agent','broken'].includes(b.dataset.mode)?'#be4242':'#4a5d7a';controls.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));});
document.getElementById('body').hidden=false;document.getElementById('caption').textContent='正在生成回复';document.getElementById('hint').hidden=true;
document.getElementById('reduce').onchange=e=>document.body.classList.toggle('reduced',e.target.checked);
</script></html>
