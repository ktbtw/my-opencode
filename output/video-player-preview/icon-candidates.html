<!doctype html>
<html><head><meta charset="utf-8"><style>
body{background:#0b0f16;color:#fff;font-family:-apple-system,"PingFang SC",sans-serif;padding:20px;margin:0}
h2{font-size:13px;color:#93B8FF;margin:20px 0 10px;font-weight:600}
.row{display:flex;gap:26px;flex-wrap:wrap}
.cell{text-align:center}
.cell .lbl{font-size:11.5px;color:#8FA3BF;margin-top:8px;line-height:1.6}
svg{width:170px;height:170px;background:#000;border-radius:10px}
svg *{vector-effect:non-scaling-stroke}
</style></head><body>

<h2>候选 A：圆弧 + 实心三角箭头（缺口在顶部）</h2>
<div class="row">
  <div class="cell">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11.2 4.8A7.4 7.4 0 1 0 15.6 5.3"/>
      <path d="M11.2 2.1 7.4 4.9l3.8 2.8z" fill="#fff" stroke="none"/>
    </svg>
    <div class="lbl">快退（逆时针，箭头朝左）</div>
  </div>
  <div class="cell">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12.8 4.8A7.4 7.4 0 1 1 8.4 5.3"/>
      <path d="M12.8 2.1 16.6 4.9l-3.8 2.8z" fill="#fff" stroke="none"/>
    </svg>
    <div class="lbl">快进（顺时针，箭头朝右）</div>
  </div>
</div>

<h2>候选 B：Material 风格（实心，最标准）</h2>
<div class="row">
  <div class="cell">
    <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
    <div class="lbl">后退 / 撤销</div>
  </div>
  <div class="cell">
    <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/></svg>
    <div class="lbl">前进 / 重做</div>
  </div>
</div>

<h2>候选 C：带 10 秒（视频播放器最常见）</h2>
<div class="row">
  <div class="cell">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11.6 5.2A7.2 7.2 0 1 0 15.9 5.7"/>
      <path d="M11.6 2.6 7.9 5.3l3.7 2.7z" fill="#fff" stroke="none"/>
      <text x="12.4" y="14.6" font-size="6.2" font-family="Helvetica" fill="#fff" stroke="none" text-anchor="middle" font-weight="600">10</text>
    </svg>
    <div class="lbl">快退 10 秒</div>
  </div>
  <div class="cell">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12.4 5.2A7.2 7.2 0 1 1 8.1 5.7"/>
      <path d="M12.4 2.6 16.1 5.3l-3.7 2.7z" fill="#fff" stroke="none"/>
      <text x="11.6" y="14.6" font-size="6.2" font-family="Helvetica" fill="#fff" stroke="none" text-anchor="middle" font-weight="600">10</text>
    </svg>
    <div class="lbl">快进 10 秒</div>
  </div>
</div>

</body></html>
