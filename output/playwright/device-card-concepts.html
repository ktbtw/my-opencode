<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>码控 - 设备卡片方案</title>
  <link rel="icon" href="data:,">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg: #f2f6fc;
      --surface: #ffffff;
      --surface-soft: #f8fafd;
      --border: #d0ddef;
      --border-light: #e8eff8;
      --text: #0f1729;
      --text-secondary: #4a5d7a;
      --text-muted: #7f93ae;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --blue-soft: #eff6ff;
      --green: #15803d;
      --green-soft: #ecfdf3;
      --amber: #b45309;
      --amber-soft: #fff7ed;
      --offline: #64748b;
      --offline-soft: #f1f5f9;
      --danger: #dc2626;
      --radius: 8px;
      --shadow-hover: 0 12px 32px rgba(37, 99, 235, 0.12);
    }

    * {
      box-sizing: border-box;
      letter-spacing: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    input:focus-visible,
    .device-card:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.22);
      outline-offset: 2px;
    }

    .app-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 60px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(14px);
    }

    .app-bar-inner {
      width: min(1320px, calc(100% - 40px));
      height: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      color: #fff;
      background: var(--blue);
    }

    .brand-mark svg {
      width: 17px;
      height: 17px;
      stroke-width: 2;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 700;
    }

    .bar-divider {
      width: 1px;
      height: 18px;
      background: var(--border);
    }

    .bar-title {
      color: var(--text-secondary);
      font-size: 13px;
    }

    .spacer {
      flex: 1;
    }

    .jump-nav {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-soft);
    }

    .jump-nav a {
      min-width: 76px;
      height: 30px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
    }

    .jump-nav a:hover {
      color: var(--blue);
      background: #fff;
    }

    main {
      width: min(1320px, calc(100% - 40px));
      margin: 0 auto;
      padding: 36px 0 72px;
    }

    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 28px;
    }

    .page-head h1 {
      margin: 0 0 8px;
      font-size: 27px;
      line-height: 1.25;
      font-weight: 720;
    }

    .page-head p {
      margin: 0;
      color: var(--text-secondary);
      line-height: 1.65;
    }

    .scope-note {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-secondary);
      background: var(--surface);
      white-space: nowrap;
      font-size: 12px;
    }

    .scope-note svg {
      width: 15px;
      height: 15px;
      color: var(--green);
    }

    .concept {
      padding: 38px 0 46px;
      border-top: 1px solid var(--border);
      scroll-margin-top: 74px;
    }

    .concept-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 420px);
      gap: 30px;
      align-items: end;
      margin-bottom: 20px;
    }

    .concept-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 7px;
    }

    .concept-index {
      color: var(--blue);
      font: 700 12px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .concept h2 {
      margin: 0;
      font-size: 21px;
      line-height: 1.3;
    }

    .recommend {
      padding: 4px 8px;
      border-radius: 999px;
      color: var(--blue-dark);
      background: var(--blue-soft);
      font-size: 11px;
      font-weight: 700;
    }

    .concept-description {
      margin: 0;
      color: var(--text-secondary);
      line-height: 1.65;
    }

    .device-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .device-card {
      position: relative;
      min-width: 0;
      min-height: 190px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      cursor: pointer;
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .device-card:hover {
      border-color: #9db9e5;
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .device-card:active {
      transform: translateY(-1px);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .platform-icon {
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      color: var(--text-secondary);
      background: var(--surface-soft);
    }

    .platform-icon svg {
      width: 19px;
      height: 19px;
      stroke-width: 1.8;
    }

    .platform-icon.online {
      color: var(--blue);
      background: var(--blue-soft);
    }

    .device-heading {
      min-width: 0;
      flex: 1;
      padding-top: 1px;
    }

    .device-name {
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      margin: 0;
      min-height: 21px;
      color: var(--text);
      font-size: 15px;
      line-height: 1.42;
      font-weight: 680;
      overflow-wrap: anywhere;
    }

    .device-subline {
      margin-top: 5px;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .more-button,
    .icon-button {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      display: inline-grid;
      place-items: center;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 7px;
      color: var(--text-muted);
      background: transparent;
      cursor: pointer;
    }

    .more-button:hover,
    .icon-button:hover {
      border-color: var(--border);
      color: var(--text);
      background: var(--surface-soft);
    }

    .more-button svg,
    .icon-button svg {
      width: 17px;
      height: 17px;
      stroke-width: 1.9;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--offline);
    }

    .status.online .status-dot {
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(21, 128, 61, 0.1);
    }

    .status.busy .status-dot {
      background: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.11);
      animation: status-pulse 1.8s ease-in-out infinite;
    }

    @keyframes status-pulse {
      50% { box-shadow: 0 0 0 6px rgba(37, 99, 235, 0); }
    }

    .meta-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      color: var(--text-secondary);
      font-size: 12px;
    }

    .meta-separator {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--border);
    }

    .card-menu {
      position: absolute;
      z-index: 20;
      top: 48px;
      right: 12px;
      width: 176px;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 16px 44px rgba(15, 23, 41, 0.15);
    }

    .card-menu[hidden] {
      display: none;
    }

    .menu-item {
      width: 100%;
      min-height: 36px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
      border: 0;
      border-radius: 6px;
      color: var(--text-secondary);
      background: transparent;
      cursor: pointer;
      text-align: left;
      font-size: 13px;
    }

    .menu-item:hover {
      color: var(--text);
      background: var(--surface-soft);
    }

    .menu-item svg {
      width: 15px;
      height: 15px;
    }

    /* Concept A */
    .minimal-card {
      display: flex;
      flex-direction: column;
    }

    .minimal-card .status {
      margin-top: 13px;
    }

    .minimal-card .meta-row {
      margin-top: auto;
      padding-top: 28px;
    }

    /* Concept B */
    .operations-card {
      display: flex;
      flex-direction: column;
      padding-left: 20px;
      overflow: visible;
    }

    .operations-card::before {
      content: "";
      position: absolute;
      inset: 12px auto 12px 0;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--offline);
    }

    .operations-card[data-state="online"]::before {
      background: var(--green);
    }

    .operations-card[data-state="busy"]::before {
      background: var(--blue);
    }

    .operations-card .card-top {
      gap: 10px;
    }

    .operations-card .status {
      margin-top: 2px;
    }

    .operation-line {
      min-height: 46px;
      margin: 20px 0 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-light);
    }

    .operation-title {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 1.35;
    }

    .operation-title svg {
      width: 14px;
      height: 14px;
      color: var(--blue);
    }

    .operation-title strong {
      min-width: 0;
      overflow: hidden;
      color: var(--text);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .progress {
      width: 100%;
      height: 4px;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 4px;
      background: #e5edf8;
    }

    .progress > span {
      display: block;
      width: var(--progress, 0%);
      height: 100%;
      border-radius: inherit;
      background: var(--blue);
    }

    .operation-idle {
      color: var(--text-muted);
    }

    .operations-footer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: auto;
    }

    .metric-label {
      color: var(--text-muted);
      font-size: 11px;
    }

    .metric-value {
      margin-top: 3px;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
    }

    /* Concept C */
    .action-card {
      display: flex;
      flex-direction: column;
      padding-bottom: 0;
      overflow: visible;
    }

    .action-card .status {
      margin: 15px 0 0 50px;
    }

    .action-summary {
      margin: 8px 0 18px 50px;
      color: var(--text-secondary);
      font-size: 12px;
    }

    .quick-actions {
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 4px;
      margin: auto -18px 0;
      padding: 7px 12px 7px 14px;
      border-top: 1px solid var(--border-light);
      background: #fbfdff;
      border-radius: 0 0 8px 8px;
    }

    .quick-actions .icon-button {
      color: var(--text-secondary);
    }

    .quick-label {
      margin-right: auto;
      color: var(--text-muted);
      font-size: 11px;
    }

    .quick-actions .open-button {
      width: auto;
      padding: 0 9px;
      gap: 5px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 650;
    }

    dialog {
      width: min(420px, calc(100% - 32px));
      padding: 0;
      border: 0;
      border-radius: 8px;
      color: var(--text);
      background: #fff;
      box-shadow: 0 28px 80px rgba(15, 23, 41, 0.24);
    }

    dialog::backdrop {
      background: rgba(15, 23, 41, 0.38);
      backdrop-filter: blur(2px);
    }

    .dialog-head {
      display: flex;
      align-items: center;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border-light);
    }

    .dialog-head h3 {
      margin: 0;
      font-size: 16px;
    }

    .dialog-body {
      padding: 20px;
    }

    .field-label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 650;
    }

    .field-wrap {
      position: relative;
    }

    .field-wrap input {
      width: 100%;
      height: 42px;
      padding: 0 58px 0 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      background: var(--surface-soft);
    }

    .field-wrap input:focus {
      border-color: var(--blue);
      background: #fff;
      outline: none;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .char-count {
      position: absolute;
      top: 50%;
      right: 12px;
      color: var(--text-muted);
      transform: translateY(-50%);
      font-size: 11px;
    }

    .field-error {
      min-height: 18px;
      margin-top: 7px;
      color: var(--danger);
      font-size: 12px;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 14px 20px;
      border-top: 1px solid var(--border-light);
      background: var(--surface-soft);
    }

    .button {
      min-width: 72px;
      height: 36px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-secondary);
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
    }

    .button:hover {
      color: var(--text);
      border-color: #aebfd8;
    }

    .button.primary {
      color: #fff;
      border-color: var(--blue);
      background: var(--blue);
    }

    .button.primary:hover {
      background: var(--blue-dark);
    }

    .toast {
      position: fixed;
      z-index: 80;
      right: 22px;
      bottom: 22px;
      min-width: 240px;
      max-width: min(420px, calc(100% - 32px));
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid #b9d5c3;
      border-radius: 8px;
      color: #14532d;
      background: #f0fdf4;
      box-shadow: 0 16px 44px rgba(15, 23, 41, 0.14);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
      font-size: 13px;
    }

    .toast.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .toast svg {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
    }

    @media (max-width: 1000px) {
      .device-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .concept-head {
        grid-template-columns: 1fr;
        gap: 8px;
      }
    }

    @media (max-width: 700px) {
      .app-bar-inner,
      main {
        width: min(100% - 28px, 1320px);
      }

      .bar-divider,
      .bar-title,
      .jump-nav {
        display: none;
      }

      main {
        padding-top: 24px;
      }

      .page-head {
        align-items: flex-start;
        flex-direction: column;
        gap: 16px;
      }

      .page-head h1 {
        font-size: 23px;
      }

      .scope-note {
        white-space: normal;
      }

      .concept {
        padding: 30px 0 38px;
      }

      .device-grid {
        grid-template-columns: 1fr;
      }

      .device-card {
        min-height: 176px;
      }

      .toast {
        right: 14px;
        bottom: 14px;
        left: 14px;
        min-width: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="app-bar">
    <div class="app-bar-inner">
      <div class="brand-mark"><i data-lucide="command"></i></div>
      <div class="brand-name">码控</div>
      <div class="bar-divider"></div>
      <div class="bar-title">设备卡片方案</div>
      <div class="spacer"></div>
      <nav class="jump-nav" aria-label="方案导航">
        <a href="#minimal">极简型</a>
        <a href="#operations">运营型</a>
        <a href="#actions">快捷型</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-head">
      <div>
        <h1>设备卡片重构</h1>
        <p>Machine ID 已从可见界面移除。设备名称按账号同步，未命名时使用系统主机名。</p>
      </div>
      <div class="scope-note"><i data-lucide="cloud"></i>账号级名称 · 多端同步</div>
    </div>

    <section class="concept" id="minimal">
      <div class="concept-head">
        <div>
          <div class="concept-title-row">
            <span class="concept-index">A / 03</span>
            <h2>极简识别</h2>
          </div>
        </div>
        <p class="concept-description">弱化运行细节，只保留识别设备所需的信息。适合设备数量少、进入详情后再操作的使用方式。</p>
      </div>
      <div class="device-grid" data-concept="minimal"></div>
    </section>

    <section class="concept" id="operations">
      <div class="concept-head">
        <div>
          <div class="concept-title-row">
            <span class="concept-index">B / 03</span>
            <h2>任务状态优先</h2>
            <span class="recommend">推荐</span>
          </div>
        </div>
        <p class="concept-description">让在线、任务和 Agent 状态形成稳定层级。适合频繁观察多个设备并快速判断是否需要处理。</p>
      </div>
      <div class="device-grid" data-concept="operations"></div>
    </section>

    <section class="concept" id="actions">
      <div class="concept-head">
        <div>
          <div class="concept-title-row">
            <span class="concept-index">C / 03</span>
            <h2>快捷操作优先</h2>
          </div>
        </div>
        <p class="concept-description">将目录、终端和设备详情入口前置。适合操作频繁，但会增加首页按钮密度。</p>
      </div>
      <div class="device-grid" data-concept="actions"></div>
    </section>
  </main>

  <dialog id="renameDialog" aria-labelledby="renameTitle">
    <form method="dialog" id="renameForm">
      <div class="dialog-head">
        <h3 id="renameTitle">修改设备名称</h3>
        <div class="spacer"></div>
        <button class="icon-button" type="button" id="closeDialog" aria-label="关闭"><i data-lucide="x"></i></button>
      </div>
      <div class="dialog-body">
        <label class="field-label" for="deviceNameInput">设备名称</label>
        <div class="field-wrap">
          <input id="deviceNameInput" maxlength="40" autocomplete="off" aria-describedby="nameError">
          <span class="char-count" id="charCount">0 / 40</span>
        </div>
        <div class="field-error" id="nameError" role="alert"></div>
      </div>
      <div class="dialog-actions">
        <button class="button" type="button" id="cancelRename">取消</button>
        <button class="button primary" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"><i data-lucide="check-circle-2"></i><span></span></div>

  <script>
    const devices = [
      {
        id: 'm_a9f37d2c48106b24d352fc189b70e812',
        name: '工作室 Mac',
        hostname: 'yuminghaodeMacBook-Air',
        platform: 'laptop',
        state: 'online',
        stateLabel: '在线',
        agents: '2 / 3',
        lastSeen: '刚刚',
        task: '',
        progress: 0
      },
      {
        id: 'm_30cb7b92e4ca1d61aa1e5f279568bb51',
        name: 'Windows 构建机',
        hostname: 'YUZHIHAO-PC',
        platform: 'monitor-cog',
        state: 'busy',
        stateLabel: '任务中',
        agents: '4 / 4',
        lastSeen: '刚刚',
        task: '正在构建 Android APK',
        progress: 68
      },
      {
        id: 'm_8eb1423a3197e443696c9b6d4c1ff023',
        name: '移动测试实验室的备用 Android 调试工作站',
        hostname: 'android-lab-backup',
        platform: 'smartphone',
        state: 'offline',
        stateLabel: '离线',
        agents: '0 / 2',
        lastSeen: '昨天 22:41',
        task: '',
        progress: 0
      }
    ];

    const grids = document.querySelectorAll('.device-grid');
    const dialog = document.getElementById('renameDialog');
    const renameForm = document.getElementById('renameForm');
    const nameInput = document.getElementById('deviceNameInput');
    const charCount = document.getElementById('charCount');
    const nameError = document.getElementById('nameError');
    const toast = document.getElementById('toast');
    let activeDeviceId = '';
    let toastTimer;

    const status = (device) => `
      <span class="status ${device.state}">
        <span class="status-dot"></span>${device.stateLabel}
      </span>`;

    const menu = (device) => `
      <div class="card-menu" hidden>
        <button class="menu-item" type="button" data-action="rename"><i data-lucide="pencil-line"></i>修改设备名称</button>
        <button class="menu-item" type="button" data-action="copy"><i data-lucide="copy"></i>复制设备标识</button>
      </div>`;

    const renderCardTop = (device, withIcon = true) => `
      <div class="card-top">
        ${withIcon ? `<div class="platform-icon ${device.state !== 'offline' ? 'online' : ''}"><i data-lucide="${device.platform}"></i></div>` : ''}
        <div class="device-heading">
          <h3 class="device-name" data-name-for="${device.id}">${device.name || device.hostname}</h3>
          ${withIcon ? '<div class="device-subline">个人设备</div>' : ''}
        </div>
        <button class="more-button" type="button" data-action="menu" aria-label="设备菜单" title="设备菜单"><i data-lucide="ellipsis"></i></button>
      </div>`;

    function renderMinimal(device) {
      return `
        <article class="device-card minimal-card" tabindex="0" data-device-id="${device.id}" data-state="${device.state}">
          ${renderCardTop(device)}
          ${status(device)}
          <div class="meta-row">
            <span>${device.agents} 个 Agent</span><span class="meta-separator"></span><span>${device.lastSeen}</span>
          </div>
          ${menu(device)}
        </article>`;
    }

    function renderOperations(device) {
      const operation = device.task
        ? `<div class="operation-title"><i data-lucide="loader-circle"></i><strong>${device.task}</strong><span>${device.progress}%</span></div><div class="progress" style="--progress:${device.progress}%"><span></span></div>`
        : `<div class="operation-title operation-idle"><i data-lucide="circle-check"></i><span>${device.state === 'offline' ? '等待设备重新连接' : '当前无运行任务'}</span></div>`;
      return `
        <article class="device-card operations-card" tabindex="0" data-device-id="${device.id}" data-state="${device.state}">
          <div class="card-top">
            <div class="device-heading">
              <h3 class="device-name" data-name-for="${device.id}">${device.name || device.hostname}</h3>
              <div class="device-subline">${status(device)}</div>
            </div>
            <button class="more-button" type="button" data-action="menu" aria-label="设备菜单" title="设备菜单"><i data-lucide="ellipsis"></i></button>
          </div>
          <div class="operation-line">${operation}</div>
          <div class="operations-footer">
            <div><div class="metric-label">Agent</div><div class="metric-value">${device.agents} 启动</div></div>
            <div><div class="metric-label">最后在线</div><div class="metric-value">${device.lastSeen}</div></div>
          </div>
          ${menu(device)}
        </article>`;
    }

    function renderActions(device) {
      return `
        <article class="device-card action-card" tabindex="0" data-device-id="${device.id}" data-state="${device.state}">
          ${renderCardTop(device)}
          ${status(device)}
          <div class="action-summary">${device.agents} 个 Agent · ${device.lastSeen}</div>
          <div class="quick-actions">
            <span class="quick-label">快捷操作</span>
            <button class="icon-button" type="button" data-quick="directory" aria-label="打开目录" title="打开目录"><i data-lucide="folder-open"></i></button>
            <button class="icon-button" type="button" data-quick="terminal" aria-label="打开终端" title="打开终端"><i data-lucide="square-terminal"></i></button>
            <button class="icon-button open-button" type="button" data-quick="detail"><i data-lucide="arrow-right"></i>详情</button>
          </div>
          ${menu(device)}
        </article>`;
    }

    function render() {
      grids.forEach((grid) => {
        const type = grid.dataset.concept;
        const renderer = type === 'minimal' ? renderMinimal : type === 'operations' ? renderOperations : renderActions;
        grid.innerHTML = devices.map(renderer).join('');
      });
      lucide.createIcons();
    }

    function closeMenus(except) {
      document.querySelectorAll('.card-menu').forEach((item) => {
        if (item !== except) item.hidden = true;
      });
    }

    function showToast(message) {
      toast.querySelector('span').textContent = message;
      toast.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('visible'), 2400);
    }

    function openRename(deviceId) {
      const device = devices.find((item) => item.id === deviceId);
      if (!device) return;
      activeDeviceId = deviceId;
      nameInput.value = device.name || device.hostname;
      charCount.textContent = `${nameInput.value.length} / 40`;
      nameError.textContent = '';
      dialog.showModal();
      requestAnimationFrame(() => {
        nameInput.focus();
        nameInput.select();
      });
    }

    document.addEventListener('click', async (event) => {
      const action = event.target.closest('[data-action]');
      const quick = event.target.closest('[data-quick]');
      const card = event.target.closest('.device-card');

      if (action && card) {
        event.stopPropagation();
        const deviceId = card.dataset.deviceId;
        if (action.dataset.action === 'menu') {
          const cardMenu = card.querySelector('.card-menu');
          const shouldOpen = cardMenu.hidden;
          closeMenus(cardMenu);
          cardMenu.hidden = !shouldOpen;
          return;
        }
        if (action.dataset.action === 'rename') {
          closeMenus();
          openRename(deviceId);
          return;
        }
        if (action.dataset.action === 'copy') {
          closeMenus();
          try {
            await navigator.clipboard.writeText(deviceId);
            showToast('设备标识已复制');
          } catch (_) {
            showToast('已准备设备标识');
          }
          return;
        }
      }

      if (quick && card) {
        event.stopPropagation();
        const device = devices.find((item) => item.id === card.dataset.deviceId);
        const labels = { directory: '打开设备目录', terminal: '打开远程终端', detail: '打开设备详情' };
        showToast(`${labels[quick.dataset.quick]} · ${device.name || device.hostname}`);
        return;
      }

      if (card) {
        const device = devices.find((item) => item.id === card.dataset.deviceId);
        showToast(`打开设备详情 · ${device.name || device.hostname}`);
      } else if (!event.target.closest('.card-menu')) {
        closeMenus();
      }
    });

    document.addEventListener('keydown', (event) => {
      if ((event.key === 'Enter' || event.key === ' ') && event.target.classList.contains('device-card')) {
        event.preventDefault();
        const device = devices.find((item) => item.id === event.target.dataset.deviceId);
        showToast(`打开设备详情 · ${device.name || device.hostname}`);
      }
      if (event.key === 'Escape') closeMenus();
    });

    nameInput.addEventListener('input', () => {
      charCount.textContent = `${nameInput.value.length} / 40`;
      nameError.textContent = '';
    });

    renameForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const value = nameInput.value.trim();
      if (!value) {
        nameError.textContent = '请输入设备名称';
        nameInput.focus();
        return;
      }
      const device = devices.find((item) => item.id === activeDeviceId);
      if (!device) return;
      device.name = value;
      document.querySelectorAll(`[data-name-for="${activeDeviceId}"]`).forEach((node) => {
        node.textContent = value;
      });
      dialog.close();
      showToast('设备名称已同步');
    });

    document.getElementById('closeDialog').addEventListener('click', () => dialog.close());
    document.getElementById('cancelRename').addEventListener('click', () => dialog.close());

    render();
  </script>
</body>
</html>
